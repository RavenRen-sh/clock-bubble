<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 预留 8px 外边距渲染柔和阴影，防止边缘硬裁切 */
    body {
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 外层主气泡容器：磨砂背景，圆角包裹并裁剪超限内容 */
    .bubble {
      width: 100%;
      height: 100%;
      background: rgba(24, 24, 27, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      padding: 8px;
      color: #f4f4f5;
      cursor: grab;
      overflow: hidden;
    }

    .bubble:active {
      cursor: grabbing;
    }

    /* 独立时钟卡片：自适应等分剩余高度，上下两行居中 */
    .clock-card {
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 13px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      pointer-events: auto;
      transition: background 0.15s ease, border-color 0.15s ease;
      overflow: hidden;
    }

    .clock-card:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.18);
    }

    /* 第 1 行：时区状态指示灯 + 完整城市名 */
    .label-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      line-height: 1.2;
    }

    .indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .local-indicator {
      background: #38bdf8;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.7);
    }

    .beijing-indicator {
      background: #f59e0b;
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.7);
    }

    /* 城市名称：行高锁定，横向空间充足不折行 */
    .label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #a1a1aa;
      text-transform: uppercase;
      white-space: nowrap;
      line-height: 1.2;
      text-align: center;
    }

    /* 第 2 行：大号等宽数字时间，独占一行且高度受控，悬停检测 */
    .time {
      font-size: 18px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.03em;
      color: #fafafa;
      white-space: nowrap;
      line-height: 1.2;
      margin-top: 4px;
      text-align: center;
      pointer-events: auto;
      cursor: default;
      transition: color 0.15s ease, text-shadow 0.15s ease;
    }

    .time:hover {
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.25);
    }

    /* 悬停日期浮层：毛玻璃质感、指示灯点缀、平滑淡入淡出 */
    .date-tooltip {
      position: fixed;
      z-index: 1000;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(18, 18, 22, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 500;
      color: #f4f4f5;
      letter-spacing: 0.04em;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transform: translateY(4px) scale(0.96);
      transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.2s cubic-bezier(0.16, 1, 0.3, 1),
                  visibility 0.2s;
    }

    .date-tooltip.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    .tooltip-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .tooltip-dot.local {
      background: #38bdf8;
      box-shadow: 0 0 6px rgba(56, 189, 248, 0.8);
    }

    .tooltip-dot.beijing {
      background: #f59e0b;
      box-shadow: 0 0 6px rgba(245, 158, 11, 0.8);
    }

    /* 右键上下文菜单：磨砂玻璃卡片、微阴影、平滑弹出 */
    .context-menu {
      position: fixed;
      z-index: 2000;
      min-width: 110px;
      background: rgba(22, 22, 26, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      opacity: 0;
      visibility: hidden;
      transform: scale(0.94);
      transform-origin: top left;
      transition: opacity 0.15s ease, transform 0.15s ease, visibility 0.15s;
    }

    .context-menu.visible {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: #f4f4f5;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
      user-select: none;
      -webkit-user-select: none;
      outline: none;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .menu-item:hover,
    .menu-item:focus-visible {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    .menu-item.exit-item:hover,
    .menu-item.exit-item:focus-visible {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }

    .menu-icon {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      stroke: currentColor;
    }
  </style>
</head>
<body>
  <main class="bubble" data-tauri-drag-region>
    <!-- 本地时钟卡片 -->
    <article class="clock-card" data-tauri-drag-region>
      <header class="label-box">
        <span class="indicator local-indicator" aria-hidden="true"></span>
        <span class="label" id="local-label">LOCAL</span>
      </header>
      <time class="time" id="local-time" aria-describedby="date-tooltip" data-tauri-drag-region>--:--:--</time>
    </article>

    <!-- 北京时钟卡片 -->
    <article class="clock-card" data-tauri-drag-region>
      <header class="label-box">
        <span class="indicator beijing-indicator" aria-hidden="true"></span>
        <span class="label">BEIJING</span>
      </header>
      <time class="time" id="beijing-time" aria-describedby="date-tooltip" data-tauri-drag-region>--:--:--</time>
    </article>
  </main>

  <!-- 悬停日期提示浮层 (WCAG 1.4.13 标准 role="tooltip") -->
  <div id="date-tooltip" class="date-tooltip" role="tooltip" aria-hidden="true">
    <span class="tooltip-dot" id="tooltip-dot" aria-hidden="true"></span>
    <span id="tooltip-text"></span>
  </div>

  <!-- 右键上下文菜单 (WCAG 标准 role="menu") -->
  <nav id="context-menu" class="context-menu" role="menu" aria-label="操作菜单" aria-hidden="true">
    <button type="button" id="menu-item-exit" class="menu-item exit-item" role="menuitem">
      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span>退出程序</span>
    </button>
  </nav>

  <script>
    const localZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    // 提取城市名作为简短标签，例如 "America/New_York" -> "NEW YORK"
    const shortCity = localZone.split('/').pop().replace(/_/g, ' ').toUpperCase();
    document.getElementById('local-label').textContent = shortCity || 'LOCAL';

    const localFormatter = new Intl.DateTimeFormat('en-GB', {
      timeZone: localZone,
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: false
    });

    const beijingFormatter = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Shanghai',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: false
    });

    const localEl = document.getElementById('local-time');
    const beijingEl = document.getElementById('beijing-time');

    function updateClocks() {
      const now = new Date();
      localEl.textContent = localFormatter.format(now);
      beijingEl.textContent = beijingFormatter.format(now);

      // 对齐下一秒整点刷新
      const delay = 1000 - (now.getTime() % 1000);
      setTimeout(updateClocks, delay);
    }

    updateClocks();

    /* ================= 悬停日期提示逻辑 ================= */
    const tooltipEl = document.getElementById('date-tooltip');
    const tooltipDotEl = document.getElementById('tooltip-dot');
    const tooltipTextEl = document.getElementById('tooltip-text');

    function formatDate(timeZone) {
      const now = new Date();
      const datePart = new Intl.DateTimeFormat('en-CA', {
        timeZone,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).format(now);
      const weekday = new Intl.DateTimeFormat('zh-CN', {
        timeZone,
        weekday: 'short'
      }).format(now);
      return `${datePart} ${weekday}`;
    }

    let hideTimer = null;

    function positionTooltip(clientX, clientY) {
      const rect = tooltipEl.getBoundingClientRect();
      const width = rect.width || 120;
      const height = rect.height || 26;

      // 水平方向以鼠标为中心，边缘留出 10px 边距防裁切
      let left = clientX - (width / 2);
      const minLeft = 10;
      const maxLeft = window.innerWidth - width - 10;
      left = Math.max(minLeft, Math.min(left, maxLeft));

      // 垂直方向默认在鼠标下方 12px；若超出视口底部，则翻转到鼠标上方 10px
      let top = clientY + 12;
      const maxTop = window.innerHeight - height - 10;
      if (top > maxTop) {
        top = clientY - height - 10;
      }
      const minTop = 10;
      top = Math.max(minTop, Math.min(top, maxTop));

      tooltipEl.style.left = `${Math.round(left)}px`;
      tooltipEl.style.top = `${Math.round(top)}px`;
    }

    function showTooltip(timeZone, dotClass, e) {
      tooltipTextEl.textContent = formatDate(timeZone);
      tooltipDotEl.className = `tooltip-dot ${dotClass}`;

      // 确保在计算坐标前测量尺寸
      tooltipEl.style.display = 'inline-flex';
      tooltipEl.style.visibility = 'hidden';
      positionTooltip(e.clientX, e.clientY);
      tooltipEl.style.visibility = 'visible';
      tooltipEl.classList.add('visible');
      tooltipEl.setAttribute('aria-hidden', 'false');

      if (hideTimer) {
        clearTimeout(hideTimer);
      }
      // 大约 10 秒后自动平滑消失
      hideTimer = setTimeout(() => {
        hideTooltip();
      }, 10000);
    }

    function hideTooltip() {
      if (hideTimer) {
        clearTimeout(hideTimer);
        hideTimer = null;
      }
      tooltipEl.classList.remove('visible');
      tooltipEl.setAttribute('aria-hidden', 'true');
    }

    // 本地时间悬停
    localEl.addEventListener('mouseenter', (e) => {
      showTooltip(localZone, 'local', e);
    });
    localEl.addEventListener('mousemove', (e) => {
      if (!tooltipEl.classList.contains('visible')) {
        showTooltip(localZone, 'local', e);
      }
    });

    // 北京时间悬停
    beijingEl.addEventListener('mouseenter', (e) => {
      showTooltip('Asia/Shanghai', 'beijing', e);
    });
    beijingEl.addEventListener('mousemove', (e) => {
      if (!tooltipEl.classList.contains('visible')) {
        showTooltip('Asia/Shanghai', 'beijing', e);
      }
    });

    // 轻量关闭：按 Escape 键或点击/拖拽时立即关闭
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        hideTooltip();
        hideContextMenu();
      }
    });
    document.addEventListener('pointerdown', (e) => {
      hideTooltip();
      if (!contextMenuEl.contains(e.target)) {
        hideContextMenu();
      }
    });

    /* ================= 右键上下文菜单逻辑 ================= */
    const contextMenuEl = document.getElementById('context-menu');
    const exitItemEl = document.getElementById('menu-item-exit');

    function positionContextMenu(clientX, clientY) {
      contextMenuEl.style.display = 'flex';
      contextMenuEl.style.visibility = 'hidden';
      const rect = contextMenuEl.getBoundingClientRect();
      const width = rect.width || 110;
      const height = rect.height || 36;

      // 水平方向自适应，超出右侧则向左展开
      let left = clientX;
      const maxLeft = window.innerWidth - width - 8;
      if (left > maxLeft) {
        left = clientX - width;
      }
      left = Math.max(8, Math.min(left, maxLeft));

      // 垂直方向自适应，超出下侧则向上展开
      let top = clientY;
      const maxTop = window.innerHeight - height - 8;
      if (top > maxTop) {
        top = clientY - height;
      }
      top = Math.max(8, Math.min(top, maxTop));

      contextMenuEl.style.left = `${Math.round(left)}px`;
      contextMenuEl.style.top = `${Math.round(top)}px`;
      contextMenuEl.style.visibility = 'visible';
    }

    function showContextMenu(e) {
      e.preventDefault();
      // 右键时隐藏可能正在显示的日期浮层
      hideTooltip();

      positionContextMenu(e.clientX, e.clientY);
      contextMenuEl.classList.add('visible');
      contextMenuEl.setAttribute('aria-hidden', 'false');
    }

    function hideContextMenu() {
      contextMenuEl.classList.remove('visible');
      contextMenuEl.setAttribute('aria-hidden', 'true');
    }

    // 监听整个窗口的右键点击
    window.addEventListener('contextmenu', (e) => {
      showContextMenu(e);
    });

    // 退出程序执行函数
    async function exitApplication() {
      try {
        if (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) {
          await window.__TAURI__.core.invoke('exit_app');
        } else if (window.__TAURI__ && window.__TAURI__.process && window.__TAURI__.process.exit) {
          await window.__TAURI__.process.exit(0);
        } else {
          window.close();
        }
      } catch (err) {
        console.error('Exit failed:', err);
        window.close();
      }
    }

    exitItemEl.addEventListener('click', (e) => {
      e.stopPropagation();
      exitApplication();
    });
  </script>
</body>
</html>
