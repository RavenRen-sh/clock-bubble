<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 预留 8px 外边距渲染柔和阴影，防止边缘硬裁切 */
    body {
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 外层主气泡容器：磨砂背景，圆角包裹并裁剪超限内容 */
    .bubble {
      width: 100%;
      height: 100%;
      background: rgba(24, 24, 27, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      padding: 8px;
      color: #f4f4f5;
      cursor: grab;
      overflow: hidden;
    }

    .bubble:active {
      cursor: grabbing;
    }

    /* 独立时钟卡片：自适应等分剩余高度，上下两行居中 */
    .clock-card {
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 13px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      pointer-events: none;
      transition: background 0.15s ease, border-color 0.15s ease;
      overflow: hidden;
    }

    .clock-card:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.18);
    }

    /* 第 1 行：时区状态指示灯 + 完整城市名 */
    .label-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      line-height: 1.2;
    }

    .indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .local-indicator {
      background: #38bdf8;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.7);
    }

    .beijing-indicator {
      background: #f59e0b;
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.7);
    }

    /* 城市名称：行高锁定，横向空间充足不折行 */
    .label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #a1a1aa;
      text-transform: uppercase;
      white-space: nowrap;
      line-height: 1.2;
      text-align: center;
    }

    /* 第 2 行：大号等宽数字时间，独占一行且高度受控 */
    .time {
      font-size: 18px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.03em;
      color: #fafafa;
      white-space: nowrap;
      line-height: 1.2;
      margin-top: 4px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="bubble" data-tauri-drag-region>
    <!-- 本地时钟卡片 -->
    <article class="clock-card">
      <header class="label-box">
        <span class="indicator local-indicator" aria-hidden="true"></span>
        <span class="label" id="local-label">LOCAL</span>
      </header>
      <time class="time" id="local-time">--:--:--</time>
    </article>

    <!-- 北京时钟卡片 -->
    <article class="clock-card">
      <header class="label-box">
        <span class="indicator beijing-indicator" aria-hidden="true"></span>
        <span class="label">BEIJING</span>
      </header>
      <time class="time" id="beijing-time">--:--:--</time>
    </article>
  </main>

  <script>
    const localZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    // 提取城市名作为简短标签，例如 "America/New_York" -> "NEW YORK"
    const shortCity = localZone.split('/').pop().replace(/_/g, ' ').toUpperCase();
    document.getElementById('local-label').textContent = shortCity || 'LOCAL';

    const localFormatter = new Intl.DateTimeFormat('en-GB', {
      timeZone: localZone,
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: false
    });

    const beijingFormatter = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Shanghai',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: false
    });

    const localEl = document.getElementById('local-time');
    const beijingEl = document.getElementById('beijing-time');

    function updateClocks() {
      const now = new Date();
      localEl.textContent = localFormatter.format(now);
      beijingEl.textContent = beijingFormatter.format(now);

      // 对齐下一秒整点刷新
      const delay = 1000 - (now.getTime() % 1000);
      setTimeout(updateClocks, delay);
    }

    updateClocks();
  </script>
</body>
</html>
