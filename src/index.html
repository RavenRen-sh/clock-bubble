<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      inline-size: 100%;
      block-size: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 留出 8px 外边距用于渲染柔和阴影，防止被窗口边缘裁切 */
    body {
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 调整为上下堆叠容器 */
    .bubble {
      inline-size: 100%;
      block-size: 100%;
      background: rgba(24, 24, 27, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 7px;
      padding: 7px;
      color: #f4f4f5;
      cursor: grab;
    }

    .bubble:active {
      cursor: grabbing;
    }

    /* 上下独立时钟卡片：左侧时区/城市名，右侧等宽时间 */
    .clock-card {
      flex: 1 1 0;
      min-inline-size: 0;
      inline-size: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 13px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-inline: 12px;
      pointer-events: none;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .clock-card:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .label-box {
      display: flex;
      align-items: center;
      gap: 7px;
      min-inline-size: 0;
      overflow: hidden;
    }

    .indicator {
      inline-size: 6px;
      block-size: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .local-indicator {
      background: #38bdf8;
      box-shadow: 0 0 6px rgba(56, 189, 248, 0.6);
    }

    .beijing-indicator {
      background: #f59e0b;
      box-shadow: 0 0 6px rgba(245, 158, 11, 0.6);
    }

    .label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: #a1a1aa;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .time {
      font-size: 15px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.03em;
      color: #fafafa;
      flex-shrink: 0;
      margin-inline-start: 10px;
    }
  </style>
</head>
<body>
  <main class="bubble" data-tauri-drag-region>
    <!-- 本地时钟卡片（上一行） -->
    <article class="clock-card">
      <header class="label-box">
        <span class="indicator local-indicator" aria-hidden="true"></span>
        <span class="label" id="local-label">LOCAL</span>
      </header>
      <time class="time" id="local-time">--:--:--</time>
    </article>

    <!-- 北京时钟卡片（下一行） -->
    <article class="clock-card">
      <header class="label-box">
        <span class="indicator beijing-indicator" aria-hidden="true"></span>
        <span class="label">BEIJING</span>
      </header>
      <time class="time" id="beijing-time">--:--:--</time>
    </article>
  </main>

  <script>
    const localZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    // 提取城市名作为简短标签，例如 "America/New_York" -> "NEW YORK"
    const shortCity = localZone.split('/').pop().replace(/_/g, ' ').toUpperCase();
    document.getElementById('local-label').textContent = shortCity || 'LOCAL';

    const localFormatter = new Intl.DateTimeFormat('en-GB', {
      timeZone: localZone,
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: false
    });

    const beijingFormatter = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Shanghai',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: false
    });

    const localEl = document.getElementById('local-time');
    const beijingEl = document.getElementById('beijing-time');

    function updateClocks() {
      const now = new Date();
      localEl.textContent = localFormatter.format(now);
      beijingEl.textContent = beijingFormatter.format(now);

      // 对齐下一秒整点刷新
      const delay = 1000 - (now.getTime() % 1000);
      setTimeout(updateClocks, delay);
    }

    updateClocks();
  </script>
</body>
</html>
