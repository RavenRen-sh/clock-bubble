<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <!-- Background Circle with border -->
  <circle cx="256" cy="256" r="236" fill="url(#bg)" stroke="rgba(255,255,255,0.18)" stroke-width="16"/>
  
  <!-- Outer tick marks -->
  <circle cx="256" cy="60" r="10" fill="#a1a1aa"/>
  <circle cx="452" cy="256" r="10" fill="#a1a1aa"/>
  <circle cx="256" cy="452" r="10" fill="#a1a1aa"/>
  <circle cx="60" cy="256" r="10" fill="#a1a1aa"/>
  
  <!-- Clock hands -->
  <!-- Hour hand (towards 10) -->
  <line x1="256" y1="256" x2="160" y2="160" stroke="#f4f4f5" stroke-width="20" stroke-linecap="round"/>
  <!-- Minute hand (towards 2) -->
  <line x1="256" y1="256" x2="350" y2="130" stroke="url(#accent)" stroke-width="16" stroke-linecap="round"/>
  <!-- Center cap -->
  <circle cx="256" cy="256" r="20" fill="#f4f4f5"/>
  <circle cx="256" cy="256" r="8" fill="#18181b"/>
</svg>
